[project]
name = "emotionlens-vercel"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.159.1",
  "python-multipart==0.0.32",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "soundfile==0.14.0",
  "librosa==0.11.0",
  "torch==2.14.1+cpu",
  "transformers==4.57.6",
  "scikit-learn==1.9.1",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
